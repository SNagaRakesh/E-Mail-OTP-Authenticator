services:
  mysql:
    image: mysql:8.0
    container_name:  mysql_container_OTPA

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: otp_authenticator_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    networks:
      - otp-authenticator-db

volumes:
  mysql-data:

networks:
  otp-authenticator-db: